# kitty user configuration
# Kept in sync with ~/setup/ghostty/config
# Included from ~/.config/kitty/kitty.conf
# https://sw.kovidgoyal.net/kitty/conf/

#: Fonts {{{

# ghostty: font-family = Iosevka
font_family Iosevka
bold_font auto
italic_font auto
bold_italic_font auto

# Nerd font glyphs come from automatic font fallback (macOS CoreText), which
# resolves to the installed Symbols Nerd Font Mono -- verified for the icon
# ranges, e.g. U+F121. Iosevka already covers box drawing, powerline (U+E0B0)
# and U+23FB itself, so no symbol_map is needed. Add one back only if fallback
# ever picks the wrong face for a specific range, e.g.:
# symbol_map U+E000-U+F8FF Symbols Nerd Font Mono

# ghostty: font-size = 14
font_size 14

#: }}}

#: Cursor {{{

# ghostty: cursor-style-blink = false
cursor_blink_interval 0

#: }}}

#: Mouse {{{

mouse_hide_wait 3.0

#: }}}

#: Bell {{{

enable_audio_bell no

#: }}}

#: Window {{{

# ghostty: macos-titlebar-style = hidden (no titlebar, no window buttons)
# `titlebar-only` looks like the match but keeps the traffic lights -- per the
# kitty 0.49.2 man page it hides ONLY the titlebar. `yes` hides the titlebar
# and the window borders, which is what actually drops the buttons -- at the
# cost of the rounded corners ghostty's `hidden` preserves.
hide_window_decorations titlebar-only

# ghostty: window-padding-y = 10,0 and the default window-padding-x = 2
# kitty takes top, right, bottom, left
window_padding_width 5 2 5 2

# ghostty: confirm-close-surface = false
confirm_os_window_close 0

#: }}}

#: Rendering {{{

# How thick dark text looks on a light background is set by the gamma (first)
# value. kitty's macOS default is 1.7, which is heavier than Ghostty; 1.5 keeps
# the weight of the old config without its 40% contrast, which is what made
# strokes look mushy. LOWER = thinner (kitty suggests starting at `1.0 0`).
text_composition_strategy 1.0 20

# ghostty: minimum-contrast = 1.6
text_fg_override_threshold 1.6 ratio

#: }}}

#: Links {{{

# closest analog to ghostty: link-previews = true (shows the link target under
# the cursor in the window title area)
show_hyperlink_targets yes

#: }}}

#: Colors {{{

# mirrors ghostty: theme = Sequoia Moonlight Light
include ./colorscheme-sequoia-moonlight-light.conf

#: }}}
